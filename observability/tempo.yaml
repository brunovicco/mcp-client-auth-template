server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4319

ingester:
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 5s
  complete_block_timeout: 1m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    blocklist_poll: 1s
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
