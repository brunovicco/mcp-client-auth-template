receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/tempo:
    endpoint: http://127.0.0.1:4319
    tls:
      insecure: true
  file/demo:
    path: /receipts/traces.jsonl
    format: json
    append: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/tempo, file/demo]
