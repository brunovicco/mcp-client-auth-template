name: supply-chain-evidence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  EVIDENCE_DIRECTORY: build/security-evidence
  IMAGE_NAME: mcp-client-auth-template:ci
  SYFT_CHECK_FOR_APP_UPDATE: "false"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"

jobs:
  sbom-and-vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install checksum-verified security tools
        shell: bash
        run: |
          bash scripts/install_security_tools.sh "${RUNNER_TEMP}/security-tools"
          echo "${RUNNER_TEMP}/security-tools" >> "$GITHUB_PATH"

      - name: Generate source CycloneDX SBOM
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIRECTORY"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          syft dir:. \
            --select-catalogers python \
            --exclude ./.git \
            --exclude ./.venv \
            --exclude ./build \
            --source-name mcp-client-auth-template \
            --source-version "$PROJECT_VERSION" \
            --output "cyclonedx-json=${EVIDENCE_DIRECTORY}/source.cdx.json"

      - name: Build production image
        run: docker build --tag "$IMAGE_NAME" .

      - name: Generate image CycloneDX SBOM
        run: >-
          syft "$IMAGE_NAME"
          --output "cyclonedx-json=${EVIDENCE_DIRECTORY}/image.cdx.json"

      - name: Record complete image vulnerability report
        run: >-
          grype "$IMAGE_NAME"
          --output json
          --file "${EVIDENCE_DIRECTORY}/grype.json"

      - name: Validate generated evidence contracts
        run: |
          python scripts/validate_security_evidence.py \
            --source-sbom "${EVIDENCE_DIRECTORY}/source.cdx.json" \
            --image-sbom "${EVIDENCE_DIRECTORY}/image.cdx.json" \
            --vulnerability-report "${EVIDENCE_DIRECTORY}/grype.json" \
            --component mcp-client-auth-template \
            --image "$IMAGE_NAME"

      - name: Enforce actionable vulnerability policy
        run: |
          python scripts/enforce_vulnerability_policy.py \
            --report "${EVIDENCE_DIRECTORY}/grype.json" \
            --exceptions security/vulnerability-exceptions.json \
            --output "${EVIDENCE_DIRECTORY}/policy.json"

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-client-auth-template-supply-chain-${{ github.sha }}
          path: build/security-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
