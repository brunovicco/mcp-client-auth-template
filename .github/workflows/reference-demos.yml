name: reference-demos

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-reference:
    name: P1.7a / headless reference
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out client repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out companion server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: brunovicco/mcp-server-auth-template
          ref: main
          path: companion-server
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Run P1.7a
        run: ./scripts/run_reference_demo.sh --server-root companion-server

  compose-reference:
    name: P1.7b / Docker Compose reference
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out client repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run P1.7b
        run: ./scripts/run_compose_demo.sh

  observable-reference:
    name: P1.7c / observable reference
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out client repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run P1.7c
        run: ./scripts/run_observability_demo.sh
