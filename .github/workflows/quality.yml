name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies, including observability tests
        run: uv sync --frozen --all-groups

      - name: Production configuration preflight
        env:
          APP_ENV: production
          MCP_CLIENT_SERVER_URL: https://mcp.acme.com
          MCP_CLIENT_AUTH_PROVIDER: entra
          MCP_CLIENT_ENTRA_TENANT_ID: 11111111-1111-1111-1111-111111111111
          MCP_CLIENT_ENTRA_CLIENT_ID: 22222222-2222-2222-2222-222222222222
        run: uv run python -m mcp_client_auth_template.entrypoints.preflight --json

      - name: Project quality gate
        run: uv run python scripts/quality_gate.py
