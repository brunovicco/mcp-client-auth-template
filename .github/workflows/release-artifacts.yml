name: release-artifact-provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install release Python
        run: uv python install 3.13

      - name: Build and validate reproducible artifacts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          uv build --build-constraints build-constraints.txt --out-dir build/release/first
          uv build --build-constraints build-constraints.txt --out-dir build/release/second
          python_bin="$(uv python find 3.13)"
          "$python_bin" scripts/prepare_release_artifacts.py \
            --first-build build/release/first \
            --second-build build/release/second \
            --output dist \
            --tag "$GITHUB_REF_NAME"

      - name: Generate GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Retain release artifacts and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-client-auth-template-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
