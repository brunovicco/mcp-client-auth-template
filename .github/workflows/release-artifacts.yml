name: secure-release-publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: secure-release-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPONENT_NAME: mcp-client-auth-template
  EVIDENCE_DIRECTORY: build/release-evidence
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SYFT_CHECK_FOR_APP_UPDATE: "false"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"

jobs:
  build-python-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install release Python
        run: uv python install 3.13

      - name: Build and validate reproducible artifacts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          uv build --build-constraints build-constraints.txt --out-dir build/release/first
          uv build --build-constraints build-constraints.txt --out-dir build/release/second
          python_bin="$(uv python find 3.13)"
          "$python_bin" scripts/prepare_release_artifacts.py \
            --first-build build/release/first \
            --second-build build/release/second \
            --output dist \
            --tag "$GITHUB_REF_NAME"

      - name: Generate Python build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Retain validated Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-client-auth-template-python-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-container:
    needs: build-python-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image-digest: ${{ steps.publish-image.outputs.digest }}
      amd64-digest: ${{ steps.publish-image.outputs.amd64-digest }}
      arm64-digest: ${{ steps.publish-image.outputs.arm64-digest }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Restore validated Python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-client-auth-template-python-${{ github.ref_name }}
          path: build/python-artifacts

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install checksum-verified security tools
        shell: bash
        run: |
          bash scripts/install_security_tools.sh "${RUNNER_TEMP}/security-tools"
          echo "${RUNNER_TEMP}/security-tools" >> "$GITHUB_PATH"

      - name: Generate source CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIRECTORY"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          syft dir:. \
            --select-catalogers python \
            --exclude ./.git \
            --exclude ./.venv \
            --exclude ./build \
            --source-name "$COMPONENT_NAME" \
            --source-version "$PROJECT_VERSION" \
            --output "cyclonedx-json=${EVIDENCE_DIRECTORY}/source.cdx.json"

      - name: Build both release platforms locally
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "${COMPONENT_NAME}:release-${GITHUB_SHA}-amd64" \
            .
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag "${COMPONENT_NAME}:release-${GITHUB_SHA}-arm64" \
            .

      - name: Generate per-platform inventory and vulnerability evidence
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            candidate_image="${COMPONENT_NAME}:release-${GITHUB_SHA}-${arch}"
            syft "$candidate_image" \
              --output "cyclonedx-json=${EVIDENCE_DIRECTORY}/image-${arch}.cdx.json"
            grype "$candidate_image" \
              --output json \
              --file "${EVIDENCE_DIRECTORY}/grype-${arch}.json"
            python scripts/validate_security_evidence.py \
              --source-sbom "${EVIDENCE_DIRECTORY}/source.cdx.json" \
              --image-sbom "${EVIDENCE_DIRECTORY}/image-${arch}.cdx.json" \
              --vulnerability-report "${EVIDENCE_DIRECTORY}/grype-${arch}.json" \
              --component "$COMPONENT_NAME" \
              --image "$candidate_image"
            python scripts/enforce_vulnerability_policy.py \
              --report "${EVIDENCE_DIRECTORY}/grype-${arch}.json" \
              --exceptions security/vulnerability-exceptions.json \
              --output "${EVIDENCE_DIRECTORY}/policy-${arch}.json"
          done

      - name: Generate Python SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: build/python-artifacts/SHA256SUMS
          sbom-path: build/release-evidence/source.cdx.json

      - name: Authenticate to GHCR after both platform policies approve
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable platform subjects and multi-platform index
        id: publish-image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/multiarch

          version_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          commit_ref="${IMAGE_NAME}:sha-${GITHUB_SHA}"

          refs=(
            "$version_ref"
            "$commit_ref"
            "${version_ref}-amd64"
            "${version_ref}-arm64"
            "${commit_ref}-amd64"
            "${commit_ref}-arm64"
          )
          for ref in "${refs[@]}"; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing image tag: $ref" >&2
              exit 1
            fi
          done

          for arch in amd64 arm64; do
            candidate_image="${COMPONENT_NAME}:release-${GITHUB_SHA}-${arch}"
            version_platform_ref="${version_ref}-${arch}"
            commit_platform_ref="${commit_ref}-${arch}"

            docker tag "$candidate_image" "$version_platform_ref"
            docker tag "$candidate_image" "$commit_platform_ref"
            docker push "$version_platform_ref"
            docker push "$commit_platform_ref"

            version_manifest="$(
              docker buildx imagetools inspect "$version_platform_ref" \
                --format '{{json .Manifest}}'
            )"
            commit_manifest="$(
              docker buildx imagetools inspect "$commit_platform_ref" \
                --format '{{json .Manifest}}'
            )"
            version_digest="$(
              printf '%s' "$version_manifest" |
                python -c 'import json,sys; print(json.load(sys.stdin)["digest"])'
            )"
            commit_digest="$(
              printf '%s' "$commit_manifest" |
                python -c 'import json,sys; print(json.load(sys.stdin)["digest"])'
            )"

            if [[ ! "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve ${arch} platform digest" >&2
              exit 1
            fi
            if [[ "$version_digest" != "$commit_digest" ]]; then
              echo "${arch} version and commit tags resolved to different digests" >&2
              exit 1
            fi
            printf '%s' "$version_digest" > "build/multiarch/${arch}.digest"
          done

          amd64_digest="$(cat build/multiarch/amd64.digest)"
          arm64_digest="$(cat build/multiarch/arm64.digest)"

          docker buildx imagetools create \
            --tag "$version_ref" \
            --metadata-file build/multiarch/version-index.json \
            "${IMAGE_NAME}@${amd64_digest}" \
            "${IMAGE_NAME}@${arm64_digest}"

          docker buildx imagetools create \
            --tag "$commit_ref" \
            --metadata-file build/multiarch/commit-index.json \
            "${IMAGE_NAME}@${amd64_digest}" \
            "${IMAGE_NAME}@${arm64_digest}"

          digest="$(
            python -c 'import json; print(json.load(open("build/multiarch/version-index.json"))["containerimage.descriptor"]["digest"])'
          )"
          commit_digest="$(
            python -c 'import json; print(json.load(open("build/multiarch/commit-index.json"))["containerimage.descriptor"]["digest"])'
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the multi-platform image digest" >&2
            exit 1
          fi
          if [[ "$digest" != "$commit_digest" ]]; then
            echo "Version and commit multi-platform tags resolved to different digests" >&2
            exit 1
          fi

          docker buildx imagetools inspect "$version_ref" \
            --format '{{json .Manifest}}' \
            > build/multiarch/registry-manifest.json

          python scripts/prepare_multiarch_image_evidence.py \
            --manifest build/multiarch/registry-manifest.json \
            --output "${EVIDENCE_DIRECTORY}/image-platforms.json" \
            --image-name "$IMAGE_NAME" \
            --index-digest "$digest" \
            --amd64-digest "$amd64_digest" \
            --arm64-digest "$arm64_digest" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"

          printf '%s@%s\n' "$IMAGE_NAME" "$digest" \
            > "${EVIDENCE_DIRECTORY}/image-digest.txt"

          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'amd64-digest=%s\n' "$amd64_digest" >> "$GITHUB_OUTPUT"
          printf 'arm64-digest=%s\n' "$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Generate multi-platform index build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate AMD64 image SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish-image.outputs.amd64-digest }}
          sbom-path: build/release-evidence/image-amd64.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Generate ARM64 image SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish-image.outputs.arm64-digest }}
          sbom-path: build/release-evidence/image-arm64.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true

      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-client-auth-template-evidence-${{ github.ref_name }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  publish-github-release:
    needs:
      - build-python-artifacts
      - publish-container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Restore validated Python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-client-auth-template-python-${{ github.ref_name }}
          path: build/publication/packages

      - name: Restore validated release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-client-auth-template-evidence-${{ github.ref_name }}
          path: build/publication/evidence

      - name: Validate the complete public release
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.publish-container.outputs.image-digest }}
        run: |
          set -euo pipefail
          python -m scripts.prepare_release_publication \
            --package-dir build/publication/packages \
            --evidence-dir build/publication/evidence \
            --output dist/release \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --image-name "$IMAGE_NAME" \
            --image-digest "$IMAGE_DIGEST"

      - name: Publish immutable GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${COMPONENT_NAME} ${GITHUB_REF_NAME}" \
            --notes-file "$notes_file"
