name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-auth-flow:
    name: MCP 2026-07-28 / companion server main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out client repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Check out companion server repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: brunovicco/mcp-server-auth-template
          ref: main
          path: companion-server
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install client dependencies
        run: uv sync --frozen --all-groups

      - name: Verify cross-repository compatibility contract
        run: |
          .venv/bin/python scripts/cross_repository_contract.py \
            --peer-root companion-server

      - name: Install companion server into the client test environment
        run: uv pip install --python .venv/bin/python -e companion-server

      - name: Run cross-repository OAuth E2E suite
        env:
          MCP_E2E_SERVER_ROOT: ${{ github.workspace }}/companion-server
        run: .venv/bin/python -m pytest -m e2e tests/e2e/test_companion_auth_flow.py --no-cov

      - name: Record compatibility evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### Cross-repository compatibility"
            echo "- protocol: \`2026-07-28\`"
            echo "- client: \`$(git rev-parse HEAD)\`"
            echo "- server: \`$(git -C companion-server rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
