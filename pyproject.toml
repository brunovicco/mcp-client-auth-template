[project]
name = "mcp-client-auth-template"
version = "0.1.0"
description = "Python service generated from the Codex Python engineering harness"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "structlog>=25.1",
    "mcp>=2.0,<3",
    "anyio>=4.8",
    # Observability: see docs/OBSERVABILITY.md and docs/adr/0003-observability-via-a2a-otel-kit.md.
    # Network-silent by default (ObservabilitySettings.enabled=False); a core dependency because
    # demo_client.py wires it into its actual request path, not optional scaffolding.
    "a2a-otel-kit>=0.4.2,<0.5",
    # Plain httpx (distinct from the mcp SDK's vendored httpx2 fork): required only because
    # a2a_otel_kit.adapters.mcp imports it directly. See the ADR for why a2a-otel-kit's own `mcp`
    # extra can't be used here (it pins mcp<2.0, conflicting with this project's mcp>=2.0,<3).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_client_auth_template"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ANN",
    "D",
    "S",
]
ignore = [
    "ANN401", # Any is handled as an architecture concern and reviewed explicitly.
    "D203",   # Incompatible with D211.
    "D213",   # Google style uses D212.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S105", "S106", "ANN"]
"scripts/**/*.py" = ["D"]
# scripts/_vendor_loop_schemas/models.py quotes its `from_dict` classmethods'
# self-referencing return annotations on purpose (see that file's own header
# comment): the quotes are load-bearing on Python 3.12/3.13 and only look
# removable to ruff's UP037 when this project's own target-version is 3.14.
# Suppressed here (not with an inline noqa) because an inline noqa becomes an
# unused-directive RUF100 error on 3.12/3.13, where UP037 never fires.
"scripts/_vendor_loop_schemas/models.py" = ["UP037"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/mcp_client_auth_template --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require real infrastructure",
    "contract: tests that verify an interface contract",
    "e2e: critical end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["src/mcp_client_auth_template"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.engineering-harness.quality]
source-roots = ["src"]
test-roots = ["tests"]

[tool.engineering-harness.architecture]
source-roots = ["src"]
clean-architecture = true
